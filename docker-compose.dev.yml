version: '3.8'

services:
  postgres:
    image: postgres:18.3
    container_name: spongeauth-postgres
    environment:
      POSTGRES_DB: spongeauth
      POSTGRES_USER: spongeauth
      POSTGRES_PASSWORD: spongeauth
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql

volumes:
  postgres18_data:
