user nginx;
worker_processes auto;
error_log /dev/stderr;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Kubelet probes hit /healthz every 5s; keep them out of the access log.
    map $http_user_agent $loggable {
        ~^kube-probe  0;
        default       1;
    }

    # One JSON object per line; query in Loki with `| json`.
    # traceparent comes from Traefik (links to Tempo); cf_ray is Cloudflare's request id.
    log_format  json  escape=json '{'
                      '"time":"$time_iso8601",'
                      '"remote_addr":"$remote_addr",'
                      '"host":"$host",'
                      '"method":"$request_method",'
                      '"uri":"$request_uri",'
                      '"status":$status,'
                      '"request_length":$request_length,'
                      '"bytes_sent":$body_bytes_sent,'
                      '"request_time":$request_time,'
                      '"upstream_status":"$upstream_status",'
                      '"upstream_response_time":"$upstream_response_time",'
                      '"upstream_cache_status":"$upstream_cache_status",'
                      '"traceparent":"$http_traceparent",'
                      '"cf_ray":"$http_cf_ray",'
                      '"referer":"$http_referer",'
                      '"user_agent":"$http_user_agent",'
                      '"x_forwarded_for":"$http_x_forwarded_for"'
                      '}';

    access_log  /dev/stdout  json if=$loggable;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    client_max_body_size 10M;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # TLS ends at Traefik: take the client address from its X-Forwarded-For.
    # The trusted proxies come from NGINX_TRUSTED_PROXIES, rendered by nginx-trusted-proxies.sh at startup.
    include             /run/nginx/trusted-proxies.conf;
    real_ip_header      X-Forwarded-For;
    real_ip_recursive   on;

    proxy_cache_path /var/cache/nginx/avatar levels=1:2 keys_zone=STATIC:10m inactive=6h max_size=2g;

    upstream spongeauth {
        # app container in the same pod
        server 127.0.0.1:8080;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name  _;

        # static/ and media/ are mounted under here, at the same paths the app container uses under public_html
        root /usr/share/nginx/public_html;

        rewrite ^/avatars(.*)$ /avatar$1;
        rewrite ^/settings$ /accounts/settings/ permanent;

        location / {
            try_files $uri @proxy_to_app;
        }

        location /static/ {
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }

        location /avatar/ {
            proxy_cache_valid       5m;
            proxy_cache             STATIC;
            proxy_cache_key         "$request_method $request_uri $http_accept";
            proxy_cache_lock        on;
            add_header X-Cache-Status $upstream_cache_status;
            expires 5m;
            proxy_hide_header Vary;
            add_header Vary "Accept";

            add_header Cache-Control "public, max-age=300, must-revalidate";

            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        Host $http_host;
            proxy_redirect          off;
            proxy_http_version      1.1;
            proxy_pass http://spongeauth;
        }

        location @proxy_to_app {
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        Host $http_host;
            proxy_redirect          off;
            proxy_http_version      1.1;
            proxy_pass http://spongeauth;
        }
    }
}
